<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https:; font-src 'self' data:;">
<title>Hendelseskart · Faktisk Studio</title>
<link rel="stylesheet" href="shared/style.css">
<link rel="stylesheet" href="leaflet.css">
<link rel="stylesheet" href="style.css">
<script src="shared/embed-tokens.js"></script>
<script src="leaflet.js"></script>
</head>
<body>
<div class="studio">

  <header class="topbar">
    <div class="faktisk-logo" role="img" aria-label="Faktisk Studio"></div>
    <span class="topbar__version" id="appVersion" title="Versjoner"></span>
    <div class="topbar__title" role="img" aria-label="Labrador"></div>
    <div class="topbar__actions">
      <button class="btn-primary" id="backBtn">Malside</button>
      <button class="btn-icon" id="newProjectBtn" title="Nytt prosjekt (tøm gjeldende)" aria-label="Nytt prosjekt">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
          <path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
        </svg>
      </button>
      <button class="btn-icon" id="fullscreenBtn" title="Fullskjerm" aria-label="Fullskjerm">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
          <path d="M5 5h5v2H7v3H5V5zm9 0h5v5h-2V7h-3V5zM5 14h2v3h3v2H5v-5zm12 0h2v5h-5v-2h3v-3z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="plugin-page">

    <aside class="plugin-sidebar">
      <div class="plugin-sidebar__head">
        <h2 class="plugin-sidebar__title">Hendelseskart</h2>
        <button id="openLabradorBtn" class="link-btn" type="button">Åpne Labrador ↗</button>
      </div>

      <div class="hk-mode">
        <button id="modeMapBtn" class="hk-mode__btn hk-mode__btn--active" type="button">Kart</button>
        <button id="modeImgBtn" class="hk-mode__btn" type="button">Eget bilde</button>
      </div>

      <!-- Kart-modus -->
      <div id="mapControls">
        <label class="url-section__label" for="geoSearch">Søk sted</label>
        <div class="url-row">
          <input type="text" id="geoSearch" class="url-row__input"
                 placeholder="Sted eller adresse…" spellcheck="false" autocomplete="off">
          <button id="geoBtn" class="btn-tiny">Søk</button>
        </div>
        <div id="geoResults" class="hk-georesults" style="display:none;"></div>

        <label class="url-section__label" for="formatSelect" style="margin-top:8px;">Format</label>
        <select id="formatSelect" class="project-select">
          <option value="169">Bredt (16:9)</option>
          <option value="916">Stående (9:16)</option>
          <option value="11">Kvadratisk (1:1)</option>
        </select>

        <label class="url-section__label" for="styleSelect" style="margin-top:8px;">Kartstil</label>
        <select id="styleSelect" class="project-select">
          <option value="standard">Standard (OSM-farger)</option>
          <option value="gratone">Gråtone — dempet</option>
          <option value="faktisk">Faktisk-tone — blå duotone</option>
        </select>
      </div>

      <!-- Eget bilde-modus -->
      <div id="imgControls" style="display:none;">
        <div class="url-section url-section--compact">
          <label class="url-section__label" for="urlImage">Kart / bakgrunnsbilde</label>
          <input type="text" id="urlImage" class="url-row__input"
                 placeholder="https://faktisk.no/uploads/…"
                 spellcheck="false" autocomplete="off">
        </div>
        <button id="loadBtn" class="btn-mini btn-mini--block">Hent bilde</button>
      </div>

      <div class="plugin-sidebar__status" id="status"></div>

      <div class="tb-section" id="pointSection">
        <div class="tb-section__header">
          <span class="url-section__label">Punkter</span>
          <div class="tb-add-buttons">
            <button id="addPointBtn" class="btn-mini" type="button" title="Legg til klikkbart punkt">+ Punkt</button>
          </div>
        </div>
        <div id="pointList" class="tb-list"></div>
        <p class="hk-hint" id="pointHint">Dra punktene på plass. Klikk et punkt
          for å se popupen slik leserne får den.</p>
      </div>

      <div class="caption-section">
        <label class="url-section__label" for="captionText">Bildetekst (valgfri)</label>
        <textarea id="captionText" class="caption-input" rows="2"
                  placeholder="Kort beskrivelse av kartet…"
                  spellcheck="true"></textarea>

        <label class="url-section__label" for="photographerText" style="margin-top: 4px;">Kilde (valgfri)</label>
        <input type="text" id="photographerText" class="caption-input caption-input--single"
               placeholder="Kart: OpenStreetMap"
               spellcheck="false" autocomplete="off">
      </div>

      <div class="plugin-sidebar__spacer"></div>

      <div class="project-row">
        <select id="projectSelect" class="project-select">
          <option value="">Velg lagret prosjekt…</option>
        </select>
        <button id="saveProjectBtn" class="btn-mini">Lagre…</button>
      </div>

      <button id="copyEmbedBtn" class="btn-mini btn-mini--block" disabled>
        Kopier embed
      </button>
    </aside>

    <section class="plugin-canvas">
      <div class="slider-stage" id="stage">
        <!-- Kart-modus -->
        <div class="hk-mapbox" id="mapBox">
          <div id="map"></div>
        </div>
        <!-- Eget bilde-modus -->
        <div class="slider-empty" id="emptyState" style="display:none;">
          <p>Last opp et kartutsnitt eller annet bilde i Labrador,
             lim inn URL-en, og trykk «Hent bilde».</p>
        </div>
        <div class="slider-preview" id="preview" style="display:none;">
          <div class="slider-clipper" id="clipper">
            <img id="imgMain" class="slider-img" alt="">
          </div>
        </div>
      </div>
    </section>

  </main>

</div>

<script src="shared/dialog.js"></script>
<script>window.PLUGIN_ID = 'hendelseskart';</script>
<script src="shared/new-project.js"></script>
<script src="shared/labrador-status.js"></script>
<script src="shared/labrador-files.js"></script>
<script src="main.js"></script>
</body>
</html>
