<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https:; font-src 'self' data:;">
<title>Bildesensur · Faktisk Studio</title>
<link rel="stylesheet" href="shared/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="studio">

  <header class="topbar">
    <div class="faktisk-logo" role="img" aria-label="Faktisk Studio"></div>
    <span class="topbar__version" id="appVersion" title="Versjoner"></span>
    <div class="topbar__title" role="img" aria-label="Labrador"></div>
    <div class="topbar__actions">
      <button class="btn-primary" id="backBtn">Malside</button>
      <button class="btn-icon" id="newProjectBtn" title="Nytt prosjekt (tøm gjeldende)" aria-label="Nytt prosjekt">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
          <path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
        </svg>
      </button>
      <button class="btn-icon" id="fullscreenBtn" title="Fullskjerm" aria-label="Fullskjerm">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
          <path d="M5 5h5v2H7v3H5V5zm9 0h5v5h-2V7h-3V5zM5 14h2v3h3v2H5v-5zm12 0h2v5h-5v-2h3v-3z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="plugin-page">

    <aside class="plugin-sidebar">
      <h2 class="plugin-sidebar__title">Bildesensur</h2>

      <p class="plugin-sidebar__desc">
        Legg masker over ansikter eller detaljer som skal sensureres.
        Dra masken for å flytte, scroll for å endre størrelse
        (⇧+scroll endrer bare høyden).
      </p>

      <div class="url-section">
        <div class="url-section__header">
          <label class="url-section__label" for="imgUrl">Bilde</label>
          <label class="link-btn filepick">Velg fil<input type="file" id="imgFile" accept="image/*" hidden></label>
        </div>
        <div class="url-row">
          <input type="text" id="imgUrl" class="url-row__input"
                 placeholder="https://… eller velg fil" spellcheck="false" autocomplete="off">
          <button id="imgLoadUrl" class="btn-tiny">Hent</button>
        </div>
      </div>

      <div class="plugin-sidebar__status" id="status"></div>

      <div class="tool-section">
        <div class="url-section__header">
          <span class="url-section__label">Masker</span>
          <button id="addMaskBtn" class="btn-tiny" disabled>+ Ny maske</button>
        </div>
        <p class="mask-empty" id="maskEmpty">Last inn et bilde og trykk «+ Ny maske».</p>
        <div class="mask-list" id="maskList"></div>
      </div>

      <div class="plugin-sidebar__spacer"></div>

      <div class="project-row">
        <select id="projectSelect" class="project-select">
          <option value="">Velg lagret prosjekt…</option>
        </select>
        <button id="saveProjectBtn" class="btn-tiny">Lagre…</button>
      </div>

      <div class="export-row">
        <button id="labradorBtn" class="btn-primary" disabled>Last opp til Labrador</button>
        <div class="export-row__sub">
          <button id="copyClipBtn" class="btn-tiny" disabled>Kopier</button>
          <button id="exportPngBtn" class="btn-tiny" disabled>PNG</button>
          <button id="exportJpgBtn" class="btn-tiny" disabled>JPG</button>
        </div>
      </div>
    </aside>

    <section class="plugin-canvas">
      <div class="canvas-area" id="canvasArea">
        <canvas id="previewCanvas"></canvas>
        <div class="canvas-empty" id="canvasEmpty">
          <p>Hent et bilde fra Labrador, lim inn en URL, eller velg en fil.</p>
        </div>
      </div>
    </section>

  </main>

</div>

<script src="shared/dialog.js"></script>
<script>window.PLUGIN_ID = 'bilde-sensur';</script>
<script src="shared/new-project.js"></script>
<script src="shared/labrador-status.js"></script>
<script src="shared/labrador-files.js"></script>
<script src="main.js"></script>
</body>
</html>
